<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a2a5c"><title>QuickFix Barak Technician Portal</title><link rel="icon" href="logo.jpg"><link rel="stylesheet" href="style.css">
<style>
body{background:#f2f4f8}.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.hd{background:#0a2a5c;color:#fff;position:sticky;top:0;z-index:5}.hd .in{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd img{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover;object-position:70% 0}.hd b{display:block;line-height:1.2}.hd small{color:#9fb6dc}
.hd .sp{flex:1}.hd button{background:#ffffff1f;color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 13px system-ui}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;border:1.5px solid var(--n);background:#fff;color:var(--n);border-radius:10px;padding:10px;font:600 15px system-ui}.tabs .on{background:var(--n);color:#fff}
.job{background:#fff;border:1px solid var(--l);border-left:5px solid var(--o);border-radius:14px;padding:14px;margin-bottom:12px}
.job h3{font-size:17px}.job .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.job p{margin:6px 0}.job .m{color:var(--m);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .btn{flex:1;justify-content:center;min-width:120px;padding:12px}
.next{width:100%;justify-content:center;padding:14px;font-size:16px;margin-top:10px}
</style></head>
<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dlg"></dialog><script src="tech.js"></script></body></html>
